plugins {
    // `java-library` already applies the `java` plugin.
    id 'java-library'
    id 'maven-publish'
}

group = 'com.tutem.platform'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // Consumers debugging through SDK internals should see the source, not decompiled bytecode.
    withSourcesJar()
}

dependencies {
    // Socket.IO transport. `api` because consumer-facing handler signatures and
    // extension points expose SocketIOClient / AckRequest / HandshakeData.
    api 'com.corundumstudio.socketio:netty-socketio:2.0.12'

    // `api` because the consumer-facing event types (SocketClientConnectedEvent and friends)
    // extend org.springframework.context.ApplicationEvent, so anyone writing an
    // @EventListener for them compiles against spring-context.
    api 'org.springframework:spring-context:6.1.12'

    // `api` because JsonSocketMessageSerializer(ObjectMapper) is a public constructor a
    // consumer calls to supply its own ObjectMapper.
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    // Internal only: the auto-configuration itself. A consumer never references it.
    implementation 'org.springframework.boot:spring-boot-autoconfigure:3.3.3'
    implementation 'org.slf4j:slf4j-api:2.0.17'

    // Optional integrations: guarded by @ConditionalOnClass, never forced on consumers.
    compileOnly 'org.springframework.boot:spring-boot-starter-actuator:3.3.3'
    compileOnly 'io.micrometer:micrometer-tracing:1.3.3'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor:3.3.3'

    //lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    //test
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator:3.3.3'
    testImplementation 'io.micrometer:micrometer-tracing:1.3.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Publishes com.tutem.platform:socket-sdk:1.0-SNAPSHOT (group/version are set above).
// `publishToMavenLocal` is enough for another repo on this machine to consume the SDK.
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    // TODO: no remote repository has been chosen yet (GitHub Packages / Nexus / Artifactory /
    //  CodeArtifact). Add a `repositories { maven { url = ...; credentials {...} } }` block here
    //  once that decision is made; until then only publishToMavenLocal works.
}
