dependencies {
    // Socket.IO server (internal implementation — not exposed in public API)
    api 'com.corundumstudio.socketio:netty-socketio:2.0.12'

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-autoconfigure:3.3.3'
    implementation 'org.springframework.boot:spring-boot-starter-web:3.3.3'

    // Metrics — Micrometer (ships with spring-boot-actuator)
    implementation 'org.springframework.boot:spring-boot-starter-actuator:3.3.3'

    // Tracing — Micrometer Tracing (Spring Boot 3 way, bridges to OTel)
    implementation 'io.micrometer:micrometer-tracing:1.3.3'

    // Jackson for JSON serialization
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.3'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
}
